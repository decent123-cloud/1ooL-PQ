<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practice all Questions | Scholar’s Circle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Practice all Questions</h1>
        <header></header>
            <p>
                <em>100L Scholar’s Circle</em><br>
                Select your course and practice!
            </p>
        </header>
        <main>
            <div id="auth-container">
                <div id="login-form">
                    <h2>Login</h2>
                    <input type="text" id="login-username" placeholder="Username" class="auth-input">
                    <input type="password" id="login-password" placeholder="Password" class="auth-input">
                    <button id="login-btn" class="login-btn">Login</button>
                    <p class="auth-link">Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
                </div>
                <div id="signup-form">
                    <h2>Sign Up</h2>
                    <input type="text" id="signup-username" placeholder="Username" class="auth-input">
                    <input type="password" id="signup-password" placeholder="Password" class="auth-input">
                    <button id="signup-btn" class="signup-btn">Sign Up</button>
                    <p class="auth-link">Already have an account? <a href="#" id="show-login">Login</a></p>
                </div>
                <div id="auth-message"></div>
            </div>
            <div id="main-content">
                <div class="tab-bar">
                    <button class="tab-btn" data-course="phy101">PHY 101</button>
                    <button class="tab-btn active" data-course="phy102">PHY 102</button>
                    <button class="tab-btn" data-course="phy123">PHY 123</button>
                    <button class="tab-btn" data-course="phy124">PHY 124</button>
                    <button class="tab-btn" data-course="cee101">CEE 101</button>
                    <button class="tab-btn" data-course="sta122">STA 122</button>
                    <button class="tab-btn" data-course="gst101">GST 101</button>
                </div>
                <section id="questions"></section>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>
        </main>
        <footer>
            <p>© 2025 Scholar’s Circle | Built for 100L Students only</p>
        </footer>
        <script src="script.js"></script>
</body>
</html>
