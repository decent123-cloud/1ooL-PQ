<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Practice All Questions | Scholar's Circle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Practice All Questions</h1>
    <p class="subtitle">Browse by Level → Department → Course</p>
    <button id="darkmode-toggle">🌙 Dark Mode</button>
  </header>

  <main class="levels-container">

    <!-- 100L -->
    <section class="level-section">
      <h2 class="level-title">100L Courses</h2>
      <div id="grid-100" class="departments-grid"></div>
    </section>

    <!-- 200L -->
    <section class="level-section">
      <h2 class="level-title">200L Courses</h2>
      <div id="grid-200" class="departments-grid"></div>
    </section>

    <!-- 300L -->
    <section class="level-section">
      <h2 class="level-title">300L Courses</h2>
      <div id="grid-300" class="departments-grid"></div>
    </section>

    <!-- 400L -->
    <section class="level-section">
      <h2 class="level-title">400L Courses</h2>
      <div id="grid-400" class="departments-grid"></div>
    </section>

    <!-- 500L -->
    <section class="level-section">
      <h2 class="level-title">500L Courses</h2>
      <div id="grid-500" class="departments-grid"></div>
    </section>

  </main>

  <!-- Questions -->
  <section id="questions"></section>

  <script src="script.js"></script>
</body>

</html>
